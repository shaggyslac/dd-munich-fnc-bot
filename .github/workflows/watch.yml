name: Friday Night Commander Watcher

on:
  # GitHub cron is UTC and enforces a 5-minute minimum. We poll Tue–Fri and let
  # the script decide the exact window (Wed 00:00 – Fri 18:00, Europe/Berlin),
  # which keeps the schedule correct across DST changes.
  schedule:
    - cron: "*/10 * * * 2,3,4,5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur anzeigen, nichts senden"
        type: boolean
        default: true
      ignore_window:
        description: "Zeitfenster ignorieren"
        type: boolean
        default: true
      test_mode:
        description: "Testmodus: sendet wirklich, als TEST markiert, eigener Status"
        type: boolean
        default: false

# Scheduled runs can overlap when GitHub is under load; never announce twice.
concurrency:
  group: fnc-watcher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check for the event
        env:
          GREENAPI_ID_INSTANCE: ${{ secrets.GREENAPI_ID_INSTANCE }}
          GREENAPI_API_TOKEN: ${{ secrets.GREENAPI_API_TOKEN }}
          GREENAPI_BASE_URL: ${{ vars.GREENAPI_BASE_URL || 'https://api.green-api.com' }}
          WHATSAPP_GROUP_ID: ${{ secrets.WHATSAPP_GROUP_ID }}
          EXPECTED_PRICE_EUR: ${{ vars.EXPECTED_PRICE_EUR || '14' }}
          DRY_RUN: ${{ inputs.dry_run }}
          IGNORE_WINDOW: ${{ inputs.ignore_window }}
          TEST_MODE: ${{ inputs.test_mode }}
        run: pnpm check

      # The commit records what was announced and, as a side effect, counts as
      # repository activity — GitHub disables scheduled workflows after 60 days
      # without any.
      #
      # The message is already out at this point. If the push were lost, the
      # next run would announce again, so rebase onto any concurrent commit and
      # retry instead of giving up on the first rejection.
      - name: Persist state
        run: |
          if [[ -z "$(git status --porcelain state/)" ]]; then
            echo "Kein Statuswechsel."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git commit -m "chore: Bot-Status aktualisiert ($(git diff --cached --name-only | xargs))"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --quiet && git push --quiet; then
              echo "Status gespeichert (Versuch $attempt)."
              exit 0
            fi
            echo "Push abgelehnt, neuer Versuch in $((attempt * 5)) s …"
            sleep $((attempt * 5))
          done
          echo "::error::Status konnte nicht gespeichert werden – der nächste Lauf könnte doppelt posten."
          exit 1
